name: Refresh dashboard

on:
  schedule:
    - cron: "30 22 * * *"   # every day 06:30 Hong Kong time
  workflow_dispatch:         # "Run workflow" button for a manual refresh
  push:
    paths: ["config.json", "templates/**", "intel/**", "run.py"]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF reader for HKEX filings
        run: pip install pypdf==6.1.1
      - name: Fetch sources and build the site
        env:
          SHEET_PASSCODE: ${{ secrets.SHEET_PASSCODE }}   # lets the refresh learn from priority changes
        run: python run.py --no-open --public --no-snapshot
      - name: Save the refreshed site
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add docs data/latest.json data/history.json data/id_map.json data/hkex_cache.json
          git diff --cached --quiet || git commit -m "Refresh dashboard data"
          git push
